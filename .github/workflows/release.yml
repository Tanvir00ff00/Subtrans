name: Release APK

# Push a tag like v0.1.0 and the signed APK appears on the Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode signing key
        # Without a key the build still succeeds, it just produces an unsigned
        # APK — but then the app cannot be updated in place on a phone, so the
        # secret is worth setting up once.
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$GITHUB_WORKSPACE/release.jks"

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Name the artifact after the tag
        id: rename
        run: |
          mkdir -p out
          src=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          name="SubTrans-${GITHUB_REF_NAME}.apk"
          cp "$src" "out/$name"
          echo "path=out/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.rename.outputs.path }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.path }}
          generate_release_notes: true
